name: CI/CD Pratico C# & Docker

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Scarica il codice
      uses: actions/checkout@v4

    - name: Configura .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Ripristina i pacchetti NuGet
      run: dotnet restore

    - name: Compila l'applicazione
      run: dotnet build --no-restore --configuration Release

  deploy-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Scarica il codice
      uses: actions/checkout@v4

    - name: Accedi al Registro Docker di GitHub (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Costruisci e Invia l'immagine Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/miaappcsharp:latest
